# Host capability descriptors. `harness gen` reads this to generate each host's
# native pre-action hook so all three converge on `bin/harness hook pre-tool`.

[claude]
hook_event = "PreToolUse"
hook_path  = ".claude-plugin/hooks.json"
matcher    = "Write|Edit|MultiEdit|Bash|Read"
deny       = "exit2"
transport  = "stdin-json"
model      = "opus"
delivery_strategy = "monitor"
delivery_event_turn = "Stop"
delivery_event_monitor = "SessionStart"

[codex]
hook_event = "PreToolUse"
hook_path  = ".codex/hooks.json"
matcher    = "*"
deny       = "permissionDecision"
transport  = "stdin-json"
model      = "gpt-5"
delivery_strategy = "turn"
delivery_event_turn = "Stop"

[cursor]
hook_event = "preToolUse"
hook_path  = ".cursor/hooks.json"
matcher    = "*"
deny       = "permission"
transport  = "stdin-json"
model      = "default"
delivery_strategy = "turn"
delivery_event_turn = "stop"

# Grok: the runtime codec/floor adapter exists, but native lifecycle-hook
# generation remains deferred. Admission-test evidence (2026-08-11, source
# inspection of grok-cli v1.1.7 src/hooks/{types,config,executor}.ts):
#   - grok-cli HAS a full hook contract (PreToolUse/PostToolUse/SessionStart/
#     SessionEnd/Stop/Subagent*/Task*/PreCompact/PostCompact) structurally
#     close to Claude Code's.
#   - BUT hooks load ONLY from ~/.grok/user-settings.json. Project-level
#     .grok/settings.json hooks are intentionally refused (repo-committed
#     hook files are treated as an injection vector by grok-cli itself).
# Consequence: the project-committed hook_path below CANNOT work as-is.
# Promotion paths: (a) generate the hook block into the USER-level
# ~/.grok/user-settings.json via scripts/setup-grok.sh, or (b) use grok only
# as an execution backend (`grok -p ... --format json`, cursor-do style)
# where CCH-side containment (worktree + Lead review + cherry-pick) applies.
# Do not infer a project-native-hook claim from this descriptor.
[grok]
hook_generation = "deferred"
hook_event = "PreToolUse"
hook_path  = ".grok/hooks/harness-pretool.json"
matcher    = "*"
deny       = "permissionDecision"
transport  = "stdin-json"
model      = "grok-4.5"
delivery_strategy = "turn"
delivery_event_turn = "Stop"
